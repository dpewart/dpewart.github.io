<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" width="30" height="30" shape-rendering="geometricPrecision">
  <!-- Main Plate: Base Color #50b954 -->
  <rect x="0.5" y="0.5" width="29" height="29" rx="2" fill="#50b954" stroke="#1d4d23" stroke-width="1"/>
  
  <!-- Recessed Double-Chamber Housing -->
  <rect x="2.5" y="2.5" width="25" height="20" rx="1" fill="#67c76b" stroke="#1d4d23" stroke-width="0.8"/>
  
  <!-- 4 Corner Bolted Reinforcements -->
  <circle cx="4" cy="4" r="0.9" fill="#1d4d23"/>
  <circle cx="26" cy="4" r="0.9" fill="#1d4d23"/>
  <circle cx="4" cy="21" r="0.9" fill="#1d4d23"/>
  <circle cx="26" cy="21" r="0.9" fill="#1d4d23"/>

  <!-- Substantial Dual Fuel Rod Flourish (Enlarged to fill space) -->
  <!-- Left Rod Assembly -->
  <rect x="6.5" y="6.5" width="7.5" height="12" rx="2.5" fill="#143618" stroke="#0b1f0e" stroke-width="0.9"/>
  <rect x="7.7" y="7.7" width="5.1" height="9.6" rx="1.8" fill="#a4f7ad"/>
  <line x1="10.25" y1="9" x2="10.25" y2="16" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Right Rod Assembly -->
  <rect x="16" y="6.5" width="7.5" height="12" rx="2.5" fill="#143618" stroke="#0b1f0e" stroke-width="0.9"/>
  <rect x="17.2" y="7.7" width="5.1" height="9.6" rx="1.8" fill="#a4f7ad"/>
  <line x1="19.75" y1="9" x2="19.75" y2="16" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Lower Bezel Channel (Clearance for 6px durability bar) -->
  <rect x="2.5" y="23.5" width="25" height="4" rx="0.5" fill="#3c8e42" stroke="#1d4d23" stroke-width="0.6"/>
</svg>
